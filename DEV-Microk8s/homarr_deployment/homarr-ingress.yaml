# Ingress yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homarr-ingress
  namespace: homarr # MUST match the namespace where your app's service lives
  annotations:
    # Specify the cert-manager resource
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Forward the original scheme + host to the backend so Homarr's
    # isSecureCookieEnabled(req) returns true and emits a Secure __Host- CSRF cookie
    traefik.ingress.kubernetes.io/forwardedheaders: "X-Forwarded-Proto,X-Forwarded-Host"
    traefik.ingress.kubernetes.io/forwardedhost-alias: "X-Forwarded-Host"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - homarr.dev.k8s.powersstudios.net # The URL you want to use
    # cert-manager will automatically create this Secret and store the certificate here
    secretName: homarr-tls-secret 
  rules:
  - host: homarr.dev.k8s.powersstudios.net # The URL you want to use
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homarr-clusterip-svc # The exact name of your app's Service
            port:
              number: 7575 # The internal port your app uses