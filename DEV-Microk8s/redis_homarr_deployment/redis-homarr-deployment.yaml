apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr-redis
  namespace: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr-redis
  template:
    metadata:
      labels:
        app: homarr-redis
    spec:
      containers:
      - name: redis
        image: redis:8.8.2-alpine  # Fixed version note below
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes: 
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-homarr-pvc