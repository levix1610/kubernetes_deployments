apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr-redis
  namespace: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redishomarr
  template:
    metadata:
      labels:
        app: redishomarr
    spec:
      containers:
      - name: redis
        image: redis:8.8.2-alpine
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-storage
          mountPath: /data # Standard default working directory for Redis
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
        volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-nfs-pvc # Your NFS PersistentVolumeClaim name