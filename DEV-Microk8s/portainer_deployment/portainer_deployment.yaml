# Portainer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: portainer
  labels:
    app.kubernetes.io/name: portainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portainer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portainer
    spec:
      serviceAccountName: portainer-sa-cluster-admin
      containers:
      - name: portainer
        image: portainer/portainer-ce:latest
        args:
        - --admin-password-file=/etc/portainer/admin_password
        # Remove or adjust args based on your TLS/Ingress setup
        ports:
        - name: http
          containerPort: 9000
        - name: https
          containerPort: 9443
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: portainer-pvc