#PV needs to be deployed before the app-pvc-nfs.yaml file.
#This tells kubernetes where the storage is and removes the need for NFS to be mounted to the host. 
#PV is a static resource in the cluster well the PVC is the request of that resource.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: homarr-pv # A unique name for your PV
  namespace: homarr
  labels:
    app: homarr
spec:
  storageClassName: nfs
  capacity:
    storage: 10Gi # Must match or exceed the PVC request
  accessModes:
    - ReadWriteMany 
  persistentVolumeReclaimPolicy: Retain # Or Recycle/Delete, choose what happens to the NFS data when the PV is released
  nfs:
    server: 10.104.104.30 # Replace with the actual IP or hostname of your NFS server / ex. 10.0.150.10
    #Path defined here HAS to exist in the directory. Will NOT create a directory for the app.
    path: /mnt/storage_pool/prod_microk8s/homarr # Replace with the actual export path on your NFS server / ex. /volume1/microk8s/nginx
  mountOptions:
    - hard
    - nfsvers=4.1
    - timeo=30        # Tries for 3 seconds before retrying (30 / 10ths of a second)
    - retrans=3       # Retries 3 times before throwing an error to unblock the client
    - noresvport      # Prevents port reuse issues during reconnects