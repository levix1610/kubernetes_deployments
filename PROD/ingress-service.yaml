# Set to create the service for defining the Traefik External IP
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: ingress
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.104.104.25
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-ingress  # <--- Essential match to Microk8s Ingress controller
  ports:
    - name: web
      port: 80
      targetPort: 8000
    - name: websecure
      port: 443
      targetPort: 8443